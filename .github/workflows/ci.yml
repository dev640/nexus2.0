name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # On the runner rather than inside `docker build`: the migration, schema and
      # two-company tests start Postgres through Testcontainers, which needs a
      # Docker daemon this process can reach. A build container has no
      # /var/run/docker.sock, so running the suite there failed on every one of
      # those tests before it ran a single assertion.
      - name: Backend tests
        working-directory: backend
        run: bash mvnw -B test
      - name: Backend image builds cleanly
        run: docker build -t nexus-backend:ci ./backend
