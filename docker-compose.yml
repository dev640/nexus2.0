services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexus
      SPRING_DATASOURCE_USERNAME: nexus
      SPRING_DATASOURCE_PASSWORD: nexus
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      NEXUS_JWT_SECRET: change-me-in-production-must-be-at-least-32-bytes-long-for-hs256
      NEXUS_JWT_EXPIRATION_MINUTES: 60
      # Comma-separated browser origins allowed to call the API.
      NEXUS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
      # Brute-force protection on /api/auth/**
      NEXUS_AUTH_RATE_LIMIT: 20
      # Supabase Auth integration — required for Supabase token verification + admin-user creation.
      NEXUS_SUPABASE_URL: https://ktvjotwmpynbjgnqjitg.supabase.co
      NEXUS_SUPABASE_USE_JWKS: true
      NEXUS_SUPABASE_AUDIENCE: authenticated
      # SERVER ONLY — never commit a value, never prefix it with VITE_. Local
      # development reads it from a .env file beside this one (Compose loads it
      # automatically and .gitignore excludes it), or from the shell. Left empty,
      # admin account creation and password resets report themselves as unavailable
      # instead of failing at request time.
      # Accepts either the legacy service_role JWT or a newer sb_secret_ key; see
      # OPERATIONS.md §12 for how to rotate one that has been exposed.
      NEXUS_SUPABASE_SERVICE_ROLE_KEY: ${NEXUS_SUPABASE_SERVICE_ROLE_KEY:-}
      # Optional AI providers. Export them in your shell (or a .env file sitting
      # next to this one) and Compose forwards them. Left unset, the Copilot
      # stays on grounded answers and Nexus AI answers in context-only mode.
      NEXUS_LLM_PROVIDER: ${NEXUS_LLM_PROVIDER:-}
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
      NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-}
      NEXUS_LLM_BASE_URL: ${NEXUS_LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Nexus AI overrides are listed but commented out on purpose: each has a
      # built-in default, and an empty value replaces the default rather than
      # selecting it. Uncomment one to pin a different model or endpoint.
      # OPENAI_BASE_URL: https://api.openai.com/v1
      # OPENAI_MODEL: gpt-4o-mini
      # OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      # NEXUS_AI_RATE_LIMIT: 20
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
