services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexus
      SPRING_DATASOURCE_USERNAME: nexus
      SPRING_DATASOURCE_PASSWORD: nexus
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      NEXUS_JWT_SECRET: change-me-in-production-must-be-at-least-32-bytes-long-for-hs256
      NEXUS_JWT_EXPIRATION_MINUTES: 60
      # Comma-separated browser origins allowed to call the API.
      NEXUS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
      # Brute-force protection on /api/auth/**
      NEXUS_AUTH_RATE_LIMIT: 20
      # Supabase Auth integration — required for Supabase token verification + admin-user creation.
      NEXUS_SUPABASE_URL: https://ktvjotwmpynbjgnqjitg.supabase.co
      NEXUS_SUPABASE_USE_JWKS: true
      NEXUS_SUPABASE_AUDIENCE: authenticated
      NEXUS_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0dmpvdHdtcHluYmpnbnFqaXRnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDg3NTk1MCwiZXhwIjoyMTA2NDUxOTUwfQ.ZhWq_YLFpf2AyzsJgiexMmQ8aIuyO6B-vz_oUK39sFU
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
