<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-v2.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon-v2.png" />
    <meta name="theme-color" content="#111111" />

    <!--
      The title and description an unfurl, a crawler or a search result sees
      before any JavaScript runs. Absolute URLs matter here: og:image is ignored
      when it is relative, which is why the origin is spelled out.
    -->
    <title>Nexus — plan, build and ship software together</title>
    <meta
      name="description"
      content="One intelligent workspace for planning, building, documenting and shipping software: backlog, sprints, docs, whiteboards and an AI copilot sharing a single data model."
    />
    <link rel="canonical" href="https://nexus-2-0-omega.vercel.app/" />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus" />
    <meta property="og:title" content="Nexus — plan, build and ship software together" />
    <meta
      property="og:description"
      content="Backlog, sprints, docs, whiteboards and an AI copilot in one fast workspace, so the plan and the work never diverge."
    />
    <meta property="og:url" content="https://nexus-2-0-omega.vercel.app/" />
    <meta property="og:image" content="https://nexus-2-0-omega.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Nexus — one workspace for planning, building and shipping software"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus — plan, build and ship software together" />
    <meta
      name="twitter:description"
      content="Backlog, sprints, docs, whiteboards and an AI copilot in one fast workspace, so the plan and the work never diverge."
    />
    <meta name="twitter:image" content="https://nexus-2-0-omega.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
