spring.application.name=backend
# PORT is provided by most container platforms (Railway, Render, Heroku).
server.port=${PORT:8080}

# Browser origins allowed to call the API (comma-separated).
# In production set this to the deployed frontend origin.
nexus.cors.allowed-origins=${NEXUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Brute-force protection on /api/auth/**
nexus.auth.rate-limit.max-requests=${NEXUS_AUTH_RATE_LIMIT:20}
nexus.auth.rate-limit.window-seconds=60

# Optional LLM-backed Copilot. Leave the key empty to use grounded answers only.
nexus.llm.api-key=${NEXUS_LLM_API_KEY:}
nexus.llm.base-url=${NEXUS_LLM_BASE_URL:https://api.openai.com/v1}
nexus.llm.model=${NEXUS_LLM_MODEL:gpt-4o-mini}

# Nexus AI assistant (RAG over Nexus data). OpenAI is the primary engine.
# The key is read server-side only and never exposed to the browser; falls back
# to NEXUS_LLM_* for existing deployments. Leave empty to run context-only.
nexus.ai.openai.api-key=${OPENAI_API_KEY:${NEXUS_LLM_API_KEY:}}
nexus.ai.openai.base-url=${OPENAI_BASE_URL:${NEXUS_LLM_BASE_URL:https://api.openai.com/v1}}
nexus.ai.openai.model=${OPENAI_MODEL:${NEXUS_LLM_MODEL:gpt-4o-mini}}
nexus.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
nexus.ai.openai.timeout-seconds=${NEXUS_AI_TIMEOUT_SECONDS:90}

# AI question rate limit (per user, per window)
nexus.ai.rate-limit.max-requests=${NEXUS_AI_RATE_LIMIT:20}
nexus.ai.rate-limit.window-seconds=60

# Retrieval: hybrid search sizes, context budget and vector index refresh
nexus.ai.retrieval.candidates=${NEXUS_AI_FTS_CANDIDATES:80}
nexus.ai.retrieval.keyword-candidates=${NEXUS_AI_KEYWORD_CANDIDATES:60}
nexus.ai.retrieval.max-chunks=${NEXUS_AI_MAX_CONTEXT_CHUNKS:6}
nexus.ai.retrieval.min-cosine=0.08
nexus.ai.retrieval.vector-max=5000
nexus.ai.retrieval.refresh-ms=300000

# Chunking of ingested documents
nexus.ai.chunk.target-chars=1000
nexus.ai.chunk.overlap-chars=120
nexus.ai.chunk.max-chunks=200

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus
spring.datasource.username=nexus
spring.datasource.password=nexus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Changed to validate for Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Configuration
jwt.secret=${NEXUS_JWT_SECRET:3f5a7c9e1b4d6f8a2c4e6f8a0b2d4e6f8a0c2e4f6a8b0c2d4e6f8a0b2c4d6e8}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server Error Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
