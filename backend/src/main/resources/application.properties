spring.application.name=backend
# PORT is provided by most container platforms (Railway, Render, Heroku).
server.port=${PORT:8080}

# Browser origins allowed to call the API (comma-separated).
# In production set this to the deployed frontend origin.
nexus.cors.allowed-origins=${NEXUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Brute-force protection on /api/auth/**
nexus.auth.rate-limit.max-requests=${NEXUS_AUTH_RATE_LIMIT:20}
nexus.auth.rate-limit.window-seconds=60

# Optional LLM-backed Copilot. Leave the key empty to use grounded answers only.
# provider: "openai" (any OpenAI-compatible /chat/completions API) or "gemini"
# (Google generateContent). base-url defaults per provider. The model has NO
# default: once a key is set the Copilot stays on grounded answers until
# NEXUS_LLM_MODEL is filled in, because a guessed model id that no longer exists
# fails on every request while looking like a transient outage.
nexus.llm.provider=${NEXUS_LLM_PROVIDER:}
nexus.llm.api-key=${NEXUS_LLM_API_KEY:}
nexus.llm.base-url=${NEXUS_LLM_BASE_URL:}
nexus.llm.model=${NEXUS_LLM_MODEL:}

# Optional Supabase Auth integration. Leave both empty to use the built-in
# email/password flow exclusively. See .env.example for where to find these.
nexus.supabase.url=${NEXUS_SUPABASE_URL:}
nexus.supabase.jwt-secret=${NEXUS_SUPABASE_JWT_SECRET:}
nexus.supabase.use-jwks=${NEXUS_SUPABASE_USE_JWKS:false}
nexus.supabase.audience=${NEXUS_SUPABASE_AUDIENCE:authenticated}
nexus.supabase.issuer=${NEXUS_SUPABASE_ISSUER:}
# Server-side only. Creates Supabase auth users and sets passwords, which is how
# admins provision accounts and issue password resets. Never expose to a browser
# build or commit it; without it those two admin features report as unavailable.
nexus.supabase.service-role-key=${NEXUS_SUPABASE_SERVICE_ROLE_KEY:}

# Multipart uploads. Only avatars are uploaded today and AvatarService enforces a
# 256 KB business limit; these servlet limits are a deliberately looser backstop
# that keeps a hostile upload from being buffered indefinitely, and any breach of
# it is reported as a 400 by GlobalExceptionHandler.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Nexus AI assistant (RAG over Nexus data). OpenAI is the primary engine.
# The key is read server-side only and never exposed to the browser; falls back
# to NEXUS_LLM_* for existing deployments. Leave empty to run context-only.
nexus.ai.openai.api-key=${OPENAI_API_KEY:${NEXUS_LLM_API_KEY:}}
nexus.ai.openai.base-url=${OPENAI_BASE_URL:${NEXUS_LLM_BASE_URL:https://api.openai.com/v1}}
nexus.ai.openai.model=${OPENAI_MODEL:${NEXUS_LLM_MODEL:gpt-4o-mini}}
nexus.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
nexus.ai.openai.timeout-seconds=${NEXUS_AI_TIMEOUT_SECONDS:90}

# AI question rate limit (per user, per window)
nexus.ai.rate-limit.max-requests=${NEXUS_AI_RATE_LIMIT:20}
nexus.ai.rate-limit.window-seconds=60

# Retrieval: hybrid search sizes, context budget and vector index refresh
nexus.ai.retrieval.candidates=${NEXUS_AI_FTS_CANDIDATES:80}
nexus.ai.retrieval.keyword-candidates=${NEXUS_AI_KEYWORD_CANDIDATES:60}
nexus.ai.retrieval.max-chunks=${NEXUS_AI_MAX_CONTEXT_CHUNKS:6}
nexus.ai.retrieval.min-cosine=0.08
nexus.ai.retrieval.vector-max=5000
nexus.ai.retrieval.refresh-ms=300000

# Chunking of ingested documents
nexus.ai.chunk.target-chars=1000
nexus.ai.chunk.overlap-chars=120
nexus.ai.chunk.max-chunks=200

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus
spring.datasource.username=nexus
spring.datasource.password=nexus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Changed to validate for Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Configuration
# No default secret is shipped. JwtUtil refuses to start when NEXUS_JWT_SECRET is
# missing or shorter than 32 bytes, so local runs must export it as well:
#   export NEXUS_JWT_SECRET=$(openssl rand -hex 32)
jwt.secret=${NEXUS_JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server Error Configuration
# Keep the container's error responses generic: an unhandled exception should not
# echo internal messages or binding details to the client. The application's own
# GlobalExceptionHandler still returns field-level validation errors on the API.
# Valid values are always|never|on_param.
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Security Headers
# Applied by SecurityHeadersFilter. HSTS is opt-in because local/dev and non-TLS
# environments should not pin a nonexistent HTTPS policy.
security.headers.hsts-max-age-seconds=${SECURITY_HEADERS_HSTS_MAX_AGE:0}
security.headers.content-security-policy=${SECURITY_HEADERS_CSP:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}

# Global request rate limit (per IP, sliding window). A shared Redis store can
# replace the in-memory map when running multiple instances.
nexus.global.rate-limit.max-requests=${NEXUS_GLOBAL_RATE_LIMIT:200}
nexus.global.rate-limit.window-seconds=${NEXUS_GLOBAL_RATE_LIMIT_WINDOW:60}

# API body-size cap (declared Content-Length). Multipart uploads keep their own
# multipart limits; this catches oversized JSON bodies before they are read.
nexus.api.max-request-size-bytes=${NEXUS_API_MAX_REQUEST_SIZE:524288}

# Container-level excess protection: form posts are swallowed only up to this
# size, and async requests cannot occupy a worker thread indefinitely.
server.tomcat.max-http-form-post-size=256KB
spring.mvc.async.request-timeout=30000

# WebSocket bounds. Chat connections may send typing/read frames, so each socket
# is bounded in frame size and in how many frames it may send per window.
nexus.ws.max-text-message-bytes=${NEXUS_WS_MAX_TEXT_MESSAGE_BYTES:65536}
nexus.ws.max-messages-per-window=${NEXUS_WS_MAX_MESSAGES_PER_WINDOW:120}
nexus.ws.message-window-seconds=${NEXUS_WS_MESSAGE_WINDOW:60}
